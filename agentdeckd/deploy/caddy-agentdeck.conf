# AgentDeck 反向代理示例：Caddy + 自动 HTTPS + SSE（终端实时流）
#
# Caddy 会自动申请证书，也会自动设置 X-Forwarded-Proto / Host，不用像 Nginx 那样手工转发。
# 1. 把域名换成你自己的（DNS A 记录指向服务器，80/443 可达）
# 2. 追加到 /etc/caddy/Caddyfile，或者放进被 import 的目录
# 3. 先建好日志文件再 reload，否则会报 "open /var/log/caddy/agentdeck-access.log: permission denied"
#    ——caddy validate 以 root 运行会抢先建出一个 root:root 的同名文件：
#      sudo install -o caddy -g caddy -m 644 /dev/null /var/log/caddy/agentdeck-access.log
# 4. sudo caddy validate --config /etc/caddy/Caddyfile && sudo systemctl reload caddy
#
# 和 Nginx 版一样：daemon 监听 0.0.0.0:3210 且带 AGENTDECK_TOKEN 时鉴权自动开启；
# 如果改成只绑 127.0.0.1，必须同时给 daemon 设 AGENTDECK_TOKEN / -token，
# 否则未启用鉴权的 Host 校验会挡住反代请求（防 DNS rebinding）。

# —— 推荐：域名 + 自动 HTTPS ——
agentdeck.example.com {
    reverse_proxy 127.0.0.1:3210 {
        # 终端输出走 SSE，必须关闭缓冲，否则要攒满才显示
        flush_interval -1
    }

    log {
        output file /var/log/caddy/agentdeck-access.log {
            roll_size 10mb
        }
    }
}

# —— 备选：没有域名时按 IP 直连 HTTP（令牌明文传输，只建议在可信网络内）——
# http://203.0.113.10 {
#     reverse_proxy 127.0.0.1:3210 {
#         flush_interval -1
#     }
#     log {
#         output file /var/log/caddy/agentdeck-access.log {
#             roll_size 10mb
#         }
#     }
# }