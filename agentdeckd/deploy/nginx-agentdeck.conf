# AgentDeck 反向代理示例：Nginx + HTTPS + SSE（终端实时流）
#
# 1. 把域名和证书路径换成你自己的（可用 certbot 签发）
# 2. 后端保持 install.sh 的默认配置（监听 0.0.0.0:3210 + AGENTDECK_TOKEN，鉴权自动开启）
#    如果改成只绑 127.0.0.1，必须同时设置 AGENTDECK_TOKEN / -token：
#    未启用鉴权时 daemon 会校验 Host 必须是本机地址，反代会收到 403（防 DNS rebinding）
# 3. nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name agentdeck.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name agentdeck.example.com;

    ssl_certificate     /etc/letsencrypt/live/agentdeck.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentdeck.example.com/privkey.pem;

    # 上传/下载产物可能比较大
    client_max_body_size 32m;

    # 终端实时输出走 SSE，不能缓冲、不能很快超时
    location /api/v1/sessions/ {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 让 daemon 知道外面是 HTTPS，登录 Cookie 才会带 Secure
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}